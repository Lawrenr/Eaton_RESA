<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>flexbox demo</title>
    <style>
        body {
            background-color: #7f9c6f;
            color: #444;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            max-width: 80%;
            margin: 0 auto;
        }

        #one {
            background-color: #97b384;
            border: 2px solid #829878;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: stretch;
        }

        #one div {
            text-align: center;
            background-color: #9cc07f;
            border: 2px solid #4444;
            border-radius: 10px;
            flex-grow: 1;
        }

        #two {
            background-color: #fff200;
            border: 2px solid #fff200;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            flex-direction: column;
           justify-content: space-around
        }

        #two div {
            text-align: center;
            background-color: #fff700;
            border: 2px solid #4444;
            border-radius: 10px;
            flex-grow: 1;
        }

        #three {
            background-color: #6cc2fc;
            border: 2px solid #47aefc;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            flex-direction: row;
            justify-content:center;
            align-items: stretch;
        }

        #three div {
            text-align: center;
            background-color: #a6d3fa;
            border: 2px solid #348cb544;
            border-radius: 10px;
        }
        .grow {
            flex-grow:2;
        }
    </style>
</head>

<body>
    <h2>flexbox dimo</h2>
    <div id="one">
        <div>
            <p>three</p>
        </div>
        <div>
            <p>one</p>
        </div>
        <div>
            <p>seven<br>has more text</p>
        </div>
    </div>

    <div id="two">
        <div>
            <p>one</p>
        </div>
        <div>
            <p>two</p>
        </div>
        <div>
            <p>three<br>has more text</p>
        </div>
    </div>

    <div id="three">
        <div>
            <p>one</p>
        </div>
        <div class="grow">
            <p>one</p>
        </div>
        <div>
            <p>five<br>has more text</p>
        </div>
    </div>
</body>

</html>
